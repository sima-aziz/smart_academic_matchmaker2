<body>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<!-- THEME SCRIPT (GLOBAL) -->
<script>
(function () {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
    }
})();
</script>
