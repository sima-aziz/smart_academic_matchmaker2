<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلبات التعاون | Requests </title>
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CSS Styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin-top: 85px;
        }

    </style>
</head>


<body>
{% include "layout/navbar.html" %}

    <div class="chat-container mt-4">

        
        <div class="dropdown">
            <h5 class="mb-3 text-center">
            💬 دردشة مع {{ other_user.first_name }}
            </h5>
            <button class="btn btn-sm" data-bs-toggle="dropdown">
                ⋮
            </button>
            <ul class="dropdown-menu">
                <li>
                    <a class="dropdown-item text-danger block-user-btn"
                    href="#"
                    data-user-id="{{ other_user.id }}">
                    🚫 Block User
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                    href="#"
                    onclick="enableReportMode()">
                    🚩 Report
                    </a>
                </li>
            </ul>
            
        </div>
        <div id="selectionBar"
            class="alert alert-secondary d-none d-flex justify-content-between align-items-center">

            <span id="selectionCount">0 messages selected</span>

            <button class="btn btn-sm btn-outline-secondary"
                    onclick="cancelReportMode()">
                ✕
            </button>
        </div>

        <div id="messages-box"
            data-chat-id="{{ chat.id }}"
            data-user-id="{{ session['user_id'] }}"
            class="chat-box mb-3">
        </div>

        <form method="post" class="d-flex gap-2">
            <textarea id="messageInput"
            name="message"
            class="form-control me-2"
            rows="1"
            placeholder="اكتب رسالتك..."
            required></textarea>
            <button class="btn btn-primary px-4">
                إرسال
            </button>
        </form>

        <div id="reportSubmitSection" class="d-none mt-3">
            <form id="reportForm" method="POST" action="/submit_report">
                
                <input type="hidden" name="reported_user_id" value="{{ other_user.id }}">
                <input type="hidden" name="messages" id="selectedMessages">
                <div id="reportModeBanner" class="alert alert-warning d-none">
                    وضع الإبلاغ مفعل — اختر الرسائل المطلوبة
                </div>
                <textarea name="reason"
                        class="form-control mb-2"
                        placeholder="اكتب سبب الإبلاغ..."
                        required></textarea>

                <button type="button"
                        class="btn btn-danger"
                        onclick="submitReport()">
                    إرسال البلاغ
                </button>
            </form>
        </div>
    </div>


<script>
const box = document.getElementById("messages-box");
const chatId = box.dataset.chatId;
const currentUserId = box.dataset.userId;
let lastMessageId = 0;

function loadMessages() {
    fetch(`/api/chat/${chatId}/messages`)
        .then(res => res.json())
        .then(data => {
            box.innerHTML = "";

            data.messages.forEach(msg => {

                if (msg.id > lastMessageId &&
                    msg.sender_id != currentUserId) {
                    showToast(msg.content);
                }

                lastMessageId = Math.max(lastMessageId, msg.id);

                const wrapper = document.createElement("div");
                wrapper.classList.add("message-wrapper");

                
                const bubble = document.createElement("div");
                bubble.classList.add("message", "chat-message");
                bubble.dataset.id = msg.id;
                
                if (reportMode) {
                    bubble.classList.add("selectable");

                    if (selectedMessages.has(msg.id)) {
                        bubble.classList.add("selected");
                    }

                    bubble.onclick = () => toggleSelection(msg.id, bubble);

                }

                if (Number(msg.sender_id) === Number(currentUserId)) {
                    bubble.classList.add("sent");
                } else {
                    bubble.classList.add("received");
                }


                if (Number(msg.sender_id) === Number(currentUserId)) {
                    bubble.classList.add("sent");
                    wrapper.classList.add("sent-wrapper");
                } else {
                    bubble.classList.add("received");
                    wrapper.classList.add("received-wrapper");
                }

                bubble.textContent = msg.content;

                const time = document.createElement("div");
                time.classList.add("message-time");
                time.textContent = msg.time;

                wrapper.appendChild(bubble);
                wrapper.appendChild(time);
                box.appendChild(wrapper);
            });



            box.scrollTop = box.scrollHeight;
        });
}

function showToast(message) {
    const toastHTML = `
        <div class="toast align-items-center text-bg-primary border-0 position-fixed bottom-0 end-0 m-3"
             role="alert" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    💬 رسالة جديدة: ${message}
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML("beforeend", toastHTML);
    const toastEl = document.querySelector(".toast:last-child");
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
}
const input = document.getElementById("messageInput");
const form = input.closest("form");

input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault(); // منع سطر جديد
        form.submit();      // إرسال الفورم
    }
});

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
});

loadMessages();
setInterval(loadMessages, 5000);

let reportMode = false;
let selectedMessages = new Set();

function enableReportMode() {

    reportMode = true;
    selectedMessages.clear();

    document.getElementById("selectionBar")
        .classList.remove("d-none");

    document.getElementById("reportSubmitSection")
        .classList.remove("d-none");

    updateSelectionCount();
    loadMessages();
}


function cancelReportMode() {

    reportMode = false;
    selectedMessages.clear();

    document.getElementById("selectionBar")
        .classList.add("d-none");

    document.getElementById("reportSubmitSection")
        .classList.add("d-none");

    updateSelectionCount();
    loadMessages();
}


function disableReportMode() {
    document.querySelectorAll(".chat-message").forEach(msg => {
        msg.classList.remove("selectable", "selected");
        msg.onclick = null;
    });

    document.getElementById("reportSubmitSection")
        .classList.add("d-none");
}

function toggleSelection(id, element) {

    if (selectedMessages.has(id)) {
        selectedMessages.delete(id);
        element.classList.remove("selected");
    } else {
        selectedMessages.add(id);
        element.classList.add("selected");
    }

    updateSelectionCount();
}


function updateSelectionCount() {
    const count = selectedMessages.size;

    document.getElementById("selectionCount")
        .textContent = `${count} message${count !== 1 ? "s" : ""} selected`;

    const submitSection = document.getElementById("reportSubmitSection");

    if (count > 0) {
        submitSection.classList.remove("d-none");
    } else if (reportMode) {
        submitSection.classList.add("d-none");
    }
}




function submitReport() {

    if (selectedMessages.size === 0) {
        alert("يرجى اختيار رسالة واحدة على الأقل");
        return;
    }

    document.getElementById("selectedMessages").value =
        JSON.stringify(Array.from(selectedMessages));

    document.getElementById("reportForm").submit();
}

document.addEventListener("DOMContentLoaded", function () {
    const blockBtn = document.querySelector(".block-user-btn");

    if (blockBtn) {
        blockBtn.addEventListener("click", function (e) {
            e.preventDefault();

            const userId = this.dataset.userId;
            openBlockModal(userId);
        });
    }
});


function openBlockModal(userId) {
    if (confirm("هل أنت متأكد أنك تريد حظر هذا المستخدم؟")) {
        window.location.href = `/block/${userId}`;
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!--Include Base Java file-->
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

{% include "layout/footer.html" %}


</body>
</html>
